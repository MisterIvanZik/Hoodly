name: CI Pipeline Hoodly

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# Optimisation 2026 : Annule les anciens builds en cours si un nouveau commit est poussé sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Bonne pratique de sécurité OWASP : Permissions minimales (lecture seule sur le code)
permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hoodly-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js & Cache Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: './hoodly-backend/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

      - name: Run unit & integration tests
        run: pnpm run test

  frontend-client-ci:
    name: Frontend Client CI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hoodly-frontend-client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js & Cache Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: './hoodly-frontend-client/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

  frontend-admin-ci:
    name: Frontend Admin CI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hoodly-frontend-admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js & Cache Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: './hoodly-frontend-admin/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

  desktop-ci:
    name: Desktop CI (JavaFX & Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hoodly-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and Test with Maven
        run: ./mvnw clean test
